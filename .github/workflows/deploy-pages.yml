name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Windows Server API URL
        env:
          ITR_API_BASE: ${{ vars.ITR_API_BASE }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlparse

          value = os.environ.get("ITR_API_BASE", "").strip().rstrip("/")
          if value:
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.netloc or parsed.query or parsed.fragment or ".." in parsed.path.split("/"):
                  raise SystemExit("ITR_API_BASE must be an HTTPS origin with an optional path prefix.")
          with open("frontend/api-config.js", "w", encoding="utf-8") as config:
              config.write("window.ITR_API_BASE_OVERRIDE = " + json.dumps(value) + ";\n")
              config.write('window.ITR_API_USERNAME = "realtime-web";\n')
          if not value:
              print("ITR_API_BASE is not set; the Pages UI will show a configuration error for backend requests.")
          PY

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
